apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: iso-a8.6-require-resources
  annotations:
    policies.kyverno.io/title: "Require CPU and Memory Requests and Limits"
    policies.kyverno.io/category: "ISO 27001"
    policies.kyverno.io/subject: "Pod"
    policies.kyverno.io/severity: medium
    policies.kyverno.io/description: >-
      Resource requests let the scheduler plan capacity; limits stop a single
      workload from exhausting a node. Every container must set CPU and memory
      requests and limits.
    compliance.framework/name: "ISO/IEC 27001:2022"
    compliance.framework/control-id: "A.8.6"
    compliance.framework/control-text: >-
      Capacity management: the use of resources shall be monitored and
      adjusted in line with current and expected capacity requirements.
    compliance.mode: "audit"
spec:
  background: true
  rules:
    - name: require-requests-and-limits
      match:
        any:
          - resources:
              kinds:
                - Pod
      validate:
        failureAction: Audit
        message: >-
          Every container must set resources.requests.cpu, requests.memory,
          limits.cpu and limits.memory (ISO 27001 A.8.6).
        pattern:
          spec:
            =(initContainers):
              - resources:
                  requests:
                    cpu: "?*"
                    memory: "?*"
                  limits:
                    cpu: "?*"
                    memory: "?*"
            containers:
              - resources:
                  requests:
                    cpu: "?*"
                    memory: "?*"
                  limits:
                    cpu: "?*"
                    memory: "?*"
