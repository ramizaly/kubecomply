apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: iso-a8.20-require-networkpolicy
  annotations:
    policies.kyverno.io/title: "Require a NetworkPolicy in Every Workload Namespace"
    policies.kyverno.io/category: "ISO 27001"
    policies.kyverno.io/subject: "Pod"
    policies.kyverno.io/severity: medium
    policies.kyverno.io/description: >-
      Workloads must not run in a namespace with no NetworkPolicy, since that
      leaves them with unrestricted pod-to-pod traffic. Validating the
      Namespace object itself cannot work (a new namespace always has zero
      policies), so this checks Pods (and, via autogen, their controllers) and
      counts NetworkPolicies in the target namespace with an API call.
    compliance.framework/name: "ISO/IEC 27001:2022"
    compliance.framework/control-id: "A.8.20"
    compliance.framework/control-text: >-
      Networks security: networks and network devices shall be secured,
      managed and controlled to protect information in systems and
      applications.
    compliance.mode: "audit"
spec:
  background: true
  rules:
    - name: namespace-has-networkpolicy
      match:
        any:
          - resources:
              kinds:
                - Pod
      context:
        - name: netpolCount
          apiCall:
            # request.object.metadata.namespace (not request.namespace) so the
            # rule also resolves during background scans.
            urlPath: "/apis/networking.k8s.io/v1/namespaces/{{ request.object.metadata.namespace }}/networkpolicies"
            jmesPath: "items | length(@)"
      validate:
        failureAction: Audit
        message: >-
          Namespace '{{ request.object.metadata.namespace }}' has no
          NetworkPolicy (ISO 27001 A.8.20). Add at least a default-deny
          NetworkPolicy before deploying workloads.
        deny:
          conditions:
            any:
              - key: "{{ netpolCount }}"
                operator: Equals
                value: 0
