apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: iso-a8.24-storageclass-encryption
  annotations:
    policies.kyverno.io/title: "Require StorageClasses to Declare Encryption at Rest"
    policies.kyverno.io/category: "ISO 27001"
    policies.kyverno.io/subject: "StorageClass"
    policies.kyverno.io/severity: high
    policies.kyverno.io/description: >-
      Every StorageClass must provision encrypted volumes (encryption at
      rest; see iso-a8.24-ingress-tls for encryption in transit). Accepted
      evidence:
      AWS EBS CSI parameters.encrypted="true"; Azure Disk CSI
      parameters.diskEncryptionSetID (customer-managed key); GCP PD CSI
      parameters.disk-encryption-kms-key (CMEK); or, for on-prem backends where
      encryption is enforced below Kubernetes (e.g. LUKS, Ceph encrypted OSDs),
      the annotation compliance.storage/encrypted-at-rest="true" as a
      human-reviewed attestation.
    compliance.framework/name: "ISO/IEC 27001:2022"
    compliance.framework/control-id: "A.8.24"
    compliance.framework/control-text: >-
      Use of cryptography: rules for the effective use of cryptography,
      including cryptographic key management, shall be defined and implemented.
    compliance.mode: "audit"
spec:
  background: true
  rules:
    # Keep in sync with the context lookup in iso-a8.24-encrypted-storage.yaml.
    - name: storageclass-declares-encryption
      match:
        any:
          - resources:
              kinds:
                - StorageClass
      validate:
        failureAction: Audit
        message: >-
          StorageClass '{{ request.object.metadata.name }}' does not declare
          encryption at rest (ISO 27001 A.8.24). Set a provider encryption
          parameter, or annotate compliance.storage/encrypted-at-rest="true"
          once backend encryption has been verified.
        anyPattern:
          - parameters:
              encrypted: "true"
          - parameters:
              diskEncryptionSetID: "?*"
          - parameters:
              disk-encryption-kms-key: "?*"
          - metadata:
              annotations:
                compliance.storage/encrypted-at-rest: "true"
