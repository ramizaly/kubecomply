# Enforcement mode per framework, with optional per-policy overrides.
# Allowed values: audit | enforce
# Everything starts in audit. Promotion to enforce is a deliberate decision,
# recorded in docs/enforcement-promotion-log.md.
compliance:
  frameworks:
    cis:
      enabled: false
      mode: audit
      # Which namespaces these policies actually apply to (admission checks
      # AND background scan) — not just whether violations are rejected vs.
      # reported. Default ["*"] = every namespace. Narrow this if you only
      # want to run compliance checks against a subset of the cluster (e.g.
      # ["team-a"] scans and applies mode only inside team-a; every other
      # namespace is untouched — no report entries, no rejections, nothing).
      # A few cluster-scoped policies (targeting ClusterRole/StorageClass,
      # not namespace-scoped resources) ignore this — see the per-policy
      # note in their template file. Override per-policy below the same way
      # as `mode`. Can be set at install/upgrade time, e.g.:
      #   --set compliance.frameworks.iso27001.namespaces={team-a}
      namespaces:
        - "*"
      # Per-policy overrides, keyed by the ClusterPolicy's metadata.name
      # (e.g. the file's basename under chart/templates/<framework>/).
      #   policies:
      #     iso-a8.2-no-privileged-nonroot:
      #       enabled: true       # set false to skip this policy entirely
      #       mode: enforce       # overrides the framework-level mode above
      #       namespaces:         # overrides the framework-level list above
      #         - team-a
      policies: {}

    iso27001:
      enabled: true
      mode: audit
      namespaces:
        - "*"
      policies: {}
        # iso-a8.2-no-privileged-nonroot:
        #   mode: enforce
        #   namespaces:
        #     - team-a

      # Registry allowlist enforced by iso-a5.23-approved-registries.
      # Kyverno wildcard patterns, matched against the full image reference.
      # CHANGE THIS to your organization's real approved registries before
      # promoting that policy to enforce mode — the defaults below are a
      # placeholder starting point, not a recommendation.
      approvedRegistries:
        - "registry.k8s.io/*"
        - "ghcr.io/kyverno/*"
        - "harbor.internal/*"

      # Accepted values for the 'environment' label required by
      # iso-a8.31-require-env-label.
      environmentLabelValues:
        - dev
        - test
        - staging
        - prod

      # Linux capabilities containers may not add, enforced by
      # iso-a8.18-disallow-dangerous-capabilities. This is a denylist, not
      # an allowlist — capabilities.drop isn't required, only these
      # specific adds are blocked. Extend if your threat model needs more.
      disallowedCapabilities:
        - ALL
        - NET_ADMIN
        - NET_RAW
        - SYS_ADMIN
        - SYS_MODULE
        - SYS_PTRACE
        - SYS_RAWIO
        - DAC_READ_SEARCH

    soc2:
      enabled: false
      mode: audit
      namespaces:
        - "*"
      policies: {}

    hipaa:
      enabled: false
      mode: audit
      namespaces:
        - "*"
      policies: {}

# --- Subchart values ---------------------------------------------------------

kyverno:
  enabled: true
  # Standalone / non-HA on purpose (lab cluster). replicaCount=3 skipped.
  # config:
  #   backgroundScanInterval: 1h   # lower during testing for faster feedback

policy-reporter:
  enabled: true
  ui:
    enabled: true
  plugin:
    kyverno:
      enabled: true
