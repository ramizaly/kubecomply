{{- $fw := .Values.compliance.frameworks.cis -}}
{{- $name := "cis-5.1.5-no-default-serviceaccount" -}}
{{- if eq (include "compliance.policyEnabled" (dict "framework" $fw "name" $name)) "true" }}
{{- $mode := include "compliance.policyMode" (dict "framework" $fw "name" $name) }}
{{- $namespaces := splitList "," (include "compliance.namespaces" (dict "framework" $fw "name" $name)) }}
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: {{ $name }}
  annotations:
    policies.kyverno.io/title: "Ensure Default Service Accounts Are Not Actively Used"
    policies.kyverno.io/category: "CIS Kubernetes Benchmark"
    policies.kyverno.io/subject: "Pod"
    policies.kyverno.io/severity: medium
    policies.kyverno.io/description: >-
      The implicit 'default' ServiceAccount is shared by every Pod in a
      namespace that doesn't request one explicitly, so granting it any RBAC
      permissions affects workloads that never opted in. Pods should name a
      dedicated, least-privilege ServiceAccount.
    compliance.framework/name: "CIS Kubernetes Benchmark"
    compliance.framework/control-id: "5.1.5"
    compliance.framework/control-text: >-
      Ensure that default service accounts are not actively used.
    compliance.mode: "{{ $mode }}"
spec:
  background: true
  rules:
    - name: disallow-default-serviceaccount
      match:
        any:
          - resources:
              kinds:
                - Pod
              {{- if not (has "*" $namespaces) }}
              namespaces:
                {{- range $namespaces }}
                - {{ . }}
                {{- end }}
              {{- end }}
      validate:
        failureAction: {{ $mode | lower | title }}
        message: >-
          Pod '{{ "{{" }} request.object.metadata.name {{ "}}" }}' uses the implicit
          'default' ServiceAccount (CIS 5.1.5). Set spec.serviceAccountName
          to a dedicated, least-privilege ServiceAccount.
        deny:
          conditions:
            any:
              - key: >-
                  {{ "{{" }} request.object.spec.serviceAccountName ||
                  request.object.spec.serviceAccount || 'default' {{ "}}" }}
                operator: Equals
                value: "default"
{{- end }}
