{{- $fw := .Values.compliance.frameworks.cis -}}
{{- $name := "cis-5.6.4-no-default-namespace" -}}
{{- if eq (include "compliance.policyEnabled" (dict "framework" $fw "name" $name)) "true" }}
{{- $mode := include "compliance.policyMode" (dict "framework" $fw "name" $name) }}
{{- $namespaces := splitList "," (include "compliance.namespaces" (dict "framework" $fw "name" $name)) }}
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: {{ $name }}
  annotations:
    policies.kyverno.io/title: "The default Namespace Should Not Be Used"
    policies.kyverno.io/category: "CIS Kubernetes Benchmark"
    policies.kyverno.io/subject: "Pod"
    policies.kyverno.io/severity: low
    policies.kyverno.io/description: >-
      Workloads left in the 'default' namespace can't be isolated by
      namespace-scoped RBAC, NetworkPolicy, or ResourceQuota from anything
      else that also lands there. Every workload should be deployed to a
      purpose-created namespace.
    compliance.framework/name: "CIS Kubernetes Benchmark"
    compliance.framework/control-id: "5.6.4"
    compliance.framework/control-text: >-
      The default namespace should not be used.
    compliance.mode: "{{ $mode }}"
spec:
  background: true
  rules:
    - name: disallow-default-namespace
      match:
        any:
          - resources:
              kinds:
                - Pod
              {{- if not (has "*" $namespaces) }}
              namespaces:
                {{- range $namespaces }}
                - {{ . }}
                {{- end }}
              {{- end }}
      validate:
        failureAction: {{ $mode | lower | title }}
        message: >-
          Workloads must not be deployed to the 'default' namespace
          (CIS 5.6.4). Create a purpose-specific namespace instead.
        deny:
          conditions:
            any:
              - key: "{{ "{{" }} request.object.metadata.namespace {{ "}}" }}"
                operator: Equals
                value: "default"
{{- end }}
