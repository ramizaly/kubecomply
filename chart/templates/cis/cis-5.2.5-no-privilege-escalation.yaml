{{- $fw := .Values.compliance.frameworks.cis -}}
{{- $name := "cis-5.2.5-no-privilege-escalation" -}}
{{- if eq (include "compliance.policyEnabled" (dict "framework" $fw "name" $name)) "true" }}
{{- $mode := include "compliance.policyMode" (dict "framework" $fw "name" $name) }}
{{- $namespaces := splitList "," (include "compliance.namespaces" (dict "framework" $fw "name" $name)) }}
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: {{ $name }}
  annotations:
    policies.kyverno.io/title: "Minimize the Admission of Containers with allowPrivilegeEscalation"
    policies.kyverno.io/category: "CIS Kubernetes Benchmark"
    policies.kyverno.io/subject: "Pod"
    policies.kyverno.io/severity: high
    policies.kyverno.io/description: >-
      allowPrivilegeEscalation defaults to true when unset, letting a
      process gain more privileges than its parent (e.g. via a setuid
      binary). It must be explicitly set to false on every container.
    compliance.framework/name: "CIS Kubernetes Benchmark"
    compliance.framework/control-id: "5.2.5"
    compliance.framework/control-text: >-
      Minimize the admission of containers with allowPrivilegeEscalation.
    compliance.mode: "{{ $mode }}"
spec:
  background: true
  rules:
    - name: require-no-privilege-escalation
      match:
        any:
          - resources:
              kinds:
                - Pod
              {{- if not (has "*" $namespaces) }}
              namespaces:
                {{- range $namespaces }}
                - {{ . }}
                {{- end }}
              {{- end }}
      validate:
        failureAction: {{ $mode | lower | title }}
        message: >-
          Containers must explicitly set
          securityContext.allowPrivilegeEscalation=false (CIS 5.2.5) —
          it defaults to true when unset.
        pattern:
          spec:
            =(ephemeralContainers):
              - securityContext:
                  allowPrivilegeEscalation: false
            =(initContainers):
              - securityContext:
                  allowPrivilegeEscalation: false
            containers:
              - securityContext:
                  allowPrivilegeEscalation: false
{{- end }}
