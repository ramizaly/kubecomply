{{- $fw := .Values.compliance.frameworks.cis -}}
{{- $name := "cis-5.2.4-no-host-network" -}}
{{- if eq (include "compliance.policyEnabled" (dict "framework" $fw "name" $name)) "true" }}
{{- $mode := include "compliance.policyMode" (dict "framework" $fw "name" $name) }}
{{- $namespaces := splitList "," (include "compliance.namespaces" (dict "framework" $fw "name" $name)) }}
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: {{ $name }}
  annotations:
    policies.kyverno.io/title: "Minimize the Admission of Containers Wishing to Share the Host Network Namespace"
    policies.kyverno.io/category: "CIS Kubernetes Benchmark"
    policies.kyverno.io/subject: "Pod"
    policies.kyverno.io/severity: high
    policies.kyverno.io/description: >-
      hostNetwork lets a container bind the node's network interfaces
      directly, bypassing whatever network segmentation NetworkPolicies are
      enforcing.
    compliance.framework/name: "CIS Kubernetes Benchmark"
    compliance.framework/control-id: "5.2.4"
    compliance.framework/control-text: >-
      Minimize the admission of containers wishing to share the host network
      namespace.
    compliance.mode: "{{ $mode }}"
spec:
  background: true
  rules:
    - name: disallow-host-network
      match:
        any:
          - resources:
              kinds:
                - Pod
              {{- if not (has "*" $namespaces) }}
              namespaces:
                {{- range $namespaces }}
                - {{ . }}
                {{- end }}
              {{- end }}
      validate:
        failureAction: {{ $mode | lower | title }}
        message: >-
          Pods must not share the host's network namespace (CIS 5.2.4).
          spec.hostNetwork must be unset or false.
        pattern:
          spec:
            =(hostNetwork): "false"
{{- end }}
