{{- $fw := .Values.compliance.frameworks.cis -}}
{{- $name := "cis-5.2.7-drop-net-raw" -}}
{{- if eq (include "compliance.policyEnabled" (dict "framework" $fw "name" $name)) "true" }}
{{- $mode := include "compliance.policyMode" (dict "framework" $fw "name" $name) }}
{{- $namespaces := splitList "," (include "compliance.namespaces" (dict "framework" $fw "name" $name)) }}
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: {{ $name }}
  annotations:
    policies.kyverno.io/title: "Minimize the Admission of Containers with the NET_RAW Capability"
    policies.kyverno.io/category: "CIS Kubernetes Benchmark"
    policies.kyverno.io/subject: "Pod"
    policies.kyverno.io/severity: medium
    policies.kyverno.io/description: >-
      NET_RAW lets a container open raw and packet sockets, enabling packet
      spoofing and network sniffing/ARP-spoofing style attacks from inside
      the pod network. It is part of the container runtime's default
      capability set unless explicitly dropped, so every container must
      drop it (or drop ALL and add back only what it needs).
    compliance.framework/name: "CIS Kubernetes Benchmark"
    compliance.framework/control-id: "5.2.7"
    compliance.framework/control-text: >-
      Minimize the admission of containers with the NET_RAW capability.
    compliance.mode: "{{ $mode }}"
spec:
  background: true
  rules:
    - name: require-net-raw-dropped
      match:
        any:
          - resources:
              kinds:
                - Pod
              {{- if not (has "*" $namespaces) }}
              namespaces:
                {{- range $namespaces }}
                - {{ . }}
                {{- end }}
              {{- end }}
      validate:
        failureAction: {{ $mode | lower | title }}
        message: >-
          Every container must drop the NET_RAW capability, or drop ALL
          (CIS 5.2.7): securityContext.capabilities.drop must include
          "NET_RAW" or "ALL".
        foreach:
          - list: "request.object.spec.containers"
            deny:
              conditions:
                all:
                  - key: "{{ "{{" }} element.securityContext.capabilities.drop || `[]` {{ "}}" }}"
                    operator: AllNotIn
                    value:
                      - NET_RAW
                  - key: "{{ "{{" }} element.securityContext.capabilities.drop || `[]` {{ "}}" }}"
                    operator: AllNotIn
                    value:
                      - ALL
          - list: "request.object.spec.initContainers || `[]`"
            deny:
              conditions:
                all:
                  - key: "{{ "{{" }} element.securityContext.capabilities.drop || `[]` {{ "}}" }}"
                    operator: AllNotIn
                    value:
                      - NET_RAW
                  - key: "{{ "{{" }} element.securityContext.capabilities.drop || `[]` {{ "}}" }}"
                    operator: AllNotIn
                    value:
                      - ALL
{{- end }}
