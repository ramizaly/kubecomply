{{- $fw := .Values.compliance.frameworks.cis -}}
{{- $name := "cis-5.4.1-no-secrets-as-env-vars" -}}
{{- if eq (include "compliance.policyEnabled" (dict "framework" $fw "name" $name)) "true" }}
{{- $mode := include "compliance.policyMode" (dict "framework" $fw "name" $name) }}
{{- $namespaces := splitList "," (include "compliance.namespaces" (dict "framework" $fw "name" $name)) }}
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: {{ $name }}
  annotations:
    policies.kyverno.io/title: "Prefer Using Secrets as Files Over Secrets as Environment Variables"
    policies.kyverno.io/category: "CIS Kubernetes Benchmark"
    policies.kyverno.io/subject: "Pod"
    policies.kyverno.io/severity: medium
    policies.kyverno.io/description: >-
      Environment variables are far more likely to leak — into crash dumps,
      `kubectl describe` output, logs, child-process environments, and
      third-party APM/error-reporting tools — than a mounted file. Secrets
      should be projected as a volume, not referenced from
      env/envFrom.
    compliance.framework/name: "CIS Kubernetes Benchmark"
    compliance.framework/control-id: "5.4.1"
    compliance.framework/control-text: >-
      Prefer using Secrets as files over Secrets as environment variables.
    compliance.mode: "{{ $mode }}"
spec:
  background: true
  rules:
    - name: disallow-secrets-as-env-vars
      match:
        any:
          - resources:
              kinds:
                - Pod
              {{- if not (has "*" $namespaces) }}
              namespaces:
                {{- range $namespaces }}
                - {{ . }}
                {{- end }}
              {{- end }}
      validate:
        failureAction: {{ $mode | lower | title }}
        message: >-
          Containers must not reference Secrets via env or envFrom
          (CIS 5.4.1). Mount the Secret as a volume instead.
        foreach:
          - list: "request.object.spec.containers"
            deny:
              conditions:
                any:
                  - key: "{{ "{{" }} length(element.env[?valueFrom.secretKeyRef] || `[]`) {{ "}}" }}"
                    operator: GreaterThan
                    value: 0
                  - key: "{{ "{{" }} length(element.envFrom[?secretRef] || `[]`) {{ "}}" }}"
                    operator: GreaterThan
                    value: 0
{{- end }}
