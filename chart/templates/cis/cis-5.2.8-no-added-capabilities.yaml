{{- $fw := .Values.compliance.frameworks.cis -}}
{{- $name := "cis-5.2.8-no-added-capabilities" -}}
{{- if eq (include "compliance.policyEnabled" (dict "framework" $fw "name" $name)) "true" }}
{{- $mode := include "compliance.policyMode" (dict "framework" $fw "name" $name) }}
{{- $namespaces := splitList "," (include "compliance.namespaces" (dict "framework" $fw "name" $name)) }}
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: {{ $name }}
  annotations:
    policies.kyverno.io/title: "Minimize the Admission of Containers with Added Capabilities"
    policies.kyverno.io/category: "CIS Kubernetes Benchmark"
    policies.kyverno.io/subject: "Pod"
    policies.kyverno.io/severity: high
    policies.kyverno.io/description: >-
      securityContext.capabilities.add grants Linux capabilities beyond the
      container runtime's default set. No container should add any
      capability beyond the default — a workload that genuinely needs one
      should get a documented, reviewed exception, not a standing grant.
    compliance.framework/name: "CIS Kubernetes Benchmark"
    compliance.framework/control-id: "5.2.8"
    compliance.framework/control-text: >-
      Minimize the admission of containers with added capabilities.
    compliance.mode: "{{ $mode }}"
spec:
  background: true
  rules:
    - name: disallow-added-capabilities
      match:
        any:
          - resources:
              kinds:
                - Pod
              {{- if not (has "*" $namespaces) }}
              namespaces:
                {{- range $namespaces }}
                - {{ . }}
                {{- end }}
              {{- end }}
      validate:
        failureAction: {{ $mode | lower | title }}
        message: >-
          Containers must not set securityContext.capabilities.add
          (CIS 5.2.8). Every capability beyond the container runtime's
          default set must be dropped, not added to.
        foreach:
          - list: "request.object.spec.containers"
            deny:
              conditions:
                any:
                  - key: "{{ "{{" }} length(element.securityContext.capabilities.add || `[]`) {{ "}}" }}"
                    operator: GreaterThan
                    value: 0
          - list: "request.object.spec.initContainers || `[]`"
            deny:
              conditions:
                any:
                  - key: "{{ "{{" }} length(element.securityContext.capabilities.add || `[]`) {{ "}}" }}"
                    operator: GreaterThan
                    value: 0
{{- end }}
