{{- $fw := .Values.compliance.frameworks.cis -}}
{{- $name := "cis-5.2.2-no-privileged-containers" -}}
{{- if eq (include "compliance.policyEnabled" (dict "framework" $fw "name" $name)) "true" }}
{{- $mode := include "compliance.policyMode" (dict "framework" $fw "name" $name) }}
{{- $namespaces := splitList "," (include "compliance.namespaces" (dict "framework" $fw "name" $name)) }}
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: {{ $name }}
  annotations:
    policies.kyverno.io/title: "Minimize the Admission of Privileged Containers"
    policies.kyverno.io/category: "CIS Kubernetes Benchmark"
    policies.kyverno.io/subject: "Pod"
    policies.kyverno.io/severity: high
    policies.kyverno.io/description: >-
      A privileged container has effectively all the capabilities of the
      host machine, removing most of the isolation a container is supposed
      to provide.
    compliance.framework/name: "CIS Kubernetes Benchmark"
    compliance.framework/control-id: "5.2.2"
    compliance.framework/control-text: >-
      Minimize the admission of privileged containers.
    compliance.mode: "{{ $mode }}"
spec:
  background: true
  rules:
    - name: disallow-privileged-containers
      match:
        any:
          - resources:
              kinds:
                - Pod
              {{- if not (has "*" $namespaces) }}
              namespaces:
                {{- range $namespaces }}
                - {{ . }}
                {{- end }}
              {{- end }}
      validate:
        failureAction: {{ $mode | lower | title }}
        message: >-
          Privileged containers are not allowed (CIS 5.2.2).
          spec.containers[*], spec.initContainers[*] and
          spec.ephemeralContainers[*] securityContext.privileged must be unset or false.
        pattern:
          spec:
            =(ephemeralContainers):
              - =(securityContext):
                  =(privileged): "false"
            =(initContainers):
              - =(securityContext):
                  =(privileged): "false"
            containers:
              - =(securityContext):
                  =(privileged): "false"
{{- end }}
