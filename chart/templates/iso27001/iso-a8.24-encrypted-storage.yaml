{{- $fw := .Values.compliance.frameworks.iso27001 -}}
{{- $name := "iso-a8.24-encrypted-storage" -}}
{{- if eq (include "compliance.policyEnabled" (dict "framework" $fw "name" $name)) "true" }}
{{- $mode := include "compliance.policyMode" (dict "framework" $fw "name" $name) }}
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: {{ $name }}
  annotations:
    policies.kyverno.io/title: "Require PVCs to Use an Encrypted StorageClass"
    policies.kyverno.io/category: "ISO 27001"
    policies.kyverno.io/subject: "PersistentVolumeClaim"
    policies.kyverno.io/severity: high
    policies.kyverno.io/description: >-
      PersistentVolumeClaims must name a StorageClass, and that StorageClass
      must declare encryption at rest. The StorageClass itself is validated by
      the companion policy iso-a8.24-storageclass-encryption; this policy looks
      up the referenced StorageClass at admission / scan time and applies the
      same encryption criteria. Covers encryption at rest only; see
      iso-a8.24-ingress-tls for encryption in transit.
    compliance.framework/name: "ISO/IEC 27001:2022"
    compliance.framework/control-id: "A.8.24"
    compliance.framework/control-text: >-
      Use of cryptography: rules for the effective use of cryptography,
      including cryptographic key management, shall be defined and implemented.
    compliance.mode: "{{ $mode }}"
spec:
  background: true
  rules:
    # Note: the DefaultStorageClass admission plugin fills storageClassName
    # before Kyverno sees the request when a default class exists, so this
    # rule mainly catches clusters without a default class and explicit "".
    - name: require-storageclass
      match:
        any:
          - resources:
              kinds:
                - PersistentVolumeClaim
      validate:
        failureAction: {{ $mode | lower | title }}
        message: >-
          PersistentVolumeClaims must set spec.storageClassName to an encrypted
          StorageClass (ISO 27001 A.8.24).
        pattern:
          spec:
            storageClassName: "?*"

    - name: storageclass-must-be-encrypted
      match:
        any:
          - resources:
              kinds:
                - PersistentVolumeClaim
      preconditions:
        all:
          - key: "{{ "{{" }} request.object.spec.storageClassName || '' {{ "}}" }}"
            operator: NotEquals
            value: ""
      context:
        - name: sc
          apiCall:
            urlPath: "/apis/storage.k8s.io/v1/storageclasses/{{ "{{" }} request.object.spec.storageClassName {{ "}}" }}"
            # Keep in sync with the anyPattern in iso-a8.24-storageclass-encryption.yaml.
            jmesPath: >-
              {
                encrypted: parameters.encrypted || '',
                diskEncryptionSetID: parameters.diskEncryptionSetID || '',
                kmsKey: parameters."disk-encryption-kms-key" || '',
                attested: metadata.annotations."compliance.storage/encrypted-at-rest" || ''
              }
      validate:
        failureAction: {{ $mode | lower | title }}
        message: >-
          StorageClass '{{ "{{" }} request.object.spec.storageClassName {{ "}}" }}' does not
          declare encryption at rest (ISO 27001 A.8.24). See
          iso-a8.24-storageclass-encryption for the accepted criteria.
        deny:
          conditions:
            all:
              - key: "{{ "{{" }} sc.encrypted {{ "}}" }}"
                operator: NotEquals
                value: "true"
              - key: "{{ "{{" }} sc.diskEncryptionSetID {{ "}}" }}"
                operator: Equals
                value: ""
              - key: "{{ "{{" }} sc.kmsKey {{ "}}" }}"
                operator: Equals
                value: ""
              - key: "{{ "{{" }} sc.attested {{ "}}" }}"
                operator: NotEquals
                value: "true"
{{- end }}
