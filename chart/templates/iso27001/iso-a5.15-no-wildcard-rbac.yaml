{{- $fw := .Values.compliance.frameworks.iso27001 -}}
{{- $name := "iso-a5.15-no-wildcard-rbac" -}}
{{- if eq (include "compliance.policyEnabled" (dict "framework" $fw "name" $name)) "true" }}
{{- $mode := include "compliance.policyMode" (dict "framework" $fw "name" $name) }}
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: {{ $name }}
  annotations:
    policies.kyverno.io/title: "Disallow Wildcard RBAC Permissions"
    policies.kyverno.io/category: "ISO 27001"
    policies.kyverno.io/subject: "Role, ClusterRole"
    policies.kyverno.io/severity: high
    policies.kyverno.io/description: >-
      Wildcards in RBAC rules grant access to every current and future verb or
      resource, violating least privilege. Roles and ClusterRoles must list
      verbs and resources explicitly.
    compliance.framework/name: "ISO/IEC 27001:2022"
    compliance.framework/control-id: "A.5.15"
    compliance.framework/control-text: >-
      Access control: rules to control physical and logical access to
      information and other associated assets shall be established and
      implemented based on business and information security requirements.
    compliance.mode: "{{ $mode }}"
spec:
  background: true
  rules:
    - name: no-wildcard-verbs-or-resources
      match:
        any:
          - resources:
              kinds:
                - Role
                - ClusterRole
      exclude:
        any:
          # Built-in roles managed by Kubernetes itself (cluster-admin is the
          # intended break-glass role and legitimately uses '*').
          - resources:
              kinds:
                - ClusterRole
              names:
                - "system:*"
                - "cluster-admin"
      validate:
        failureAction: {{ $mode | lower | title }}
        message: >-
          RBAC rule {{ "{{" }} elementIndex {{ "}}" }} in {{ "{{" }} request.object.kind {{ "}}" }}
          '{{ "{{" }} request.object.metadata.name {{ "}}" }}' uses a wildcard ('*') in verbs or
          resources (ISO 27001 A.5.15). List permissions explicitly.
        foreach:
          # Aggregated ClusterRoles may have no rules of their own.
          - list: "request.object.rules || `[]`"
            deny:
              conditions:
                any:
                  - key: "{{ "{{" }} element.verbs || `[]` {{ "}}" }}"
                    operator: AnyIn
                    value:
                      - "*"
                  - key: "{{ "{{" }} element.resources || `[]` {{ "}}" }}"
                    operator: AnyIn
                    value:
                      - "*"
{{- end }}
