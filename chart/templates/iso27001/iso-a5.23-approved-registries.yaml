{{- $fw := .Values.compliance.frameworks.iso27001 -}}
{{- $name := "iso-a5.23-approved-registries" -}}
{{- if eq (include "compliance.policyEnabled" (dict "framework" $fw "name" $name)) "true" }}
{{- $mode := include "compliance.policyMode" (dict "framework" $fw "name" $name) }}
{{- if not $fw.approvedRegistries }}
{{- fail "compliance.frameworks.iso27001.approvedRegistries must list at least one registry pattern when this policy is enabled" }}
{{- end }}
{{- $registries := join " | " $fw.approvedRegistries }}
{{- $namespaces := splitList "," (include "compliance.namespaces" (dict "framework" $fw "name" $name)) }}
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: {{ $name }}
  annotations:
    policies.kyverno.io/title: "Restrict Images to Approved Registries"
    policies.kyverno.io/category: "ISO 27001"
    policies.kyverno.io/subject: "Pod"
    policies.kyverno.io/severity: high
    policies.kyverno.io/description: >-
      Container images are an externally sourced service. Only images from
      registries the organisation has approved (and scans) may run. Images
      without an explicit registry resolve to docker.io and are rejected. The
      allowlist is set via compliance.frameworks.iso27001.approvedRegistries
      in values.yaml.
    compliance.framework/name: "ISO/IEC 27001:2022"
    compliance.framework/control-id: "A.5.23"
    compliance.framework/control-text: >-
      Information security for use of cloud services: processes for
      acquisition, use, management and exit from cloud services shall be
      established in accordance with the organization's information security
      requirements.
    compliance.mode: "{{ $mode }}"
spec:
  background: true
  rules:
    - name: approved-registries-only
      match:
        any:
          - resources:
              kinds:
                - Pod
              {{- if not (has "*" $namespaces) }}
              namespaces:
                {{- range $namespaces }}
                - {{ . }}
                {{- end }}
              {{- end }}
      validate:
        failureAction: {{ $mode | lower | title }}
        message: >-
          Image is not from an approved registry (ISO 27001 A.5.23).
          Approved: {{ $registries }}.
        pattern:
          spec:
            =(ephemeralContainers):
              - image: "{{ $registries }}"
            =(initContainers):
              - image: "{{ $registries }}"
            containers:
              - image: "{{ $registries }}"
{{- end }}
