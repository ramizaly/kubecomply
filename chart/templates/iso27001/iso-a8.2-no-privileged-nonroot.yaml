{{- $fw := .Values.compliance.frameworks.iso27001 -}}
{{- $name := "iso-a8.2-no-privileged-nonroot" -}}
{{- if eq (include "compliance.policyEnabled" (dict "framework" $fw "name" $name)) "true" }}
{{- $mode := include "compliance.policyMode" (dict "framework" $fw "name" $name) }}
{{- $namespaces := splitList "," (include "compliance.namespaces" (dict "framework" $fw "name" $name)) }}
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: {{ $name }}
  annotations:
    policies.kyverno.io/title: "Disallow Privileged Containers and Require Non-Root"
    policies.kyverno.io/category: "ISO 27001"
    policies.kyverno.io/subject: "Pod"
    policies.kyverno.io/severity: high
    policies.kyverno.io/description: >-
      Privileged containers and containers running as root weaken the node's
      security boundary. All containers must run unprivileged and with
      runAsNonRoot=true, set either at Pod level or on every container.
    compliance.framework/name: "ISO/IEC 27001:2022"
    compliance.framework/control-id: "A.8.2"
    compliance.framework/control-text: >-
      Privileged access rights: the allocation and use of privileged access
      rights shall be restricted and managed.
    compliance.mode: "{{ $mode }}"
spec:
  background: true
  rules:
    - name: disallow-privileged-containers
      match:
        any:
          - resources:
              kinds:
                - Pod
              {{- if not (has "*" $namespaces) }}
              namespaces:
                {{- range $namespaces }}
                - {{ . }}
                {{- end }}
              {{- end }}
      validate:
        failureAction: {{ $mode | lower | title }}
        message: >-
          Privileged containers are not allowed (ISO 27001 A.8.2).
          spec.containers[*], spec.initContainers[*] and
          spec.ephemeralContainers[*] securityContext.privileged must be unset or false.
        pattern:
          spec:
            =(ephemeralContainers):
              - =(securityContext):
                  =(privileged): "false"
            =(initContainers):
              - =(securityContext):
                  =(privileged): "false"
            containers:
              - =(securityContext):
                  =(privileged): "false"

    # runAsNonRoot=true makes the kubelet refuse to start a container whose
    # effective UID is 0, so an explicit runAsUser: 0 also fails at runtime.
    - name: require-run-as-non-root
      match:
        any:
          - resources:
              kinds:
                - Pod
              {{- if not (has "*" $namespaces) }}
              namespaces:
                {{- range $namespaces }}
                - {{ . }}
                {{- end }}
              {{- end }}
      validate:
        failureAction: {{ $mode | lower | title }}
        message: >-
          Containers must run as non-root (ISO 27001 A.8.2). Set
          securityContext.runAsNonRoot=true at Pod level, or on every container.
        anyPattern:
          # Option 1: set at Pod level; containers may not override it to false.
          - spec:
              securityContext:
                runAsNonRoot: true
              =(ephemeralContainers):
                - =(securityContext):
                    =(runAsNonRoot): true
              =(initContainers):
                - =(securityContext):
                    =(runAsNonRoot): true
              containers:
                - =(securityContext):
                    =(runAsNonRoot): true
          # Option 2: set explicitly on every container.
          - spec:
              =(ephemeralContainers):
                - securityContext:
                    runAsNonRoot: true
              =(initContainers):
                - securityContext:
                    runAsNonRoot: true
              containers:
                - securityContext:
                    runAsNonRoot: true
{{- end }}
