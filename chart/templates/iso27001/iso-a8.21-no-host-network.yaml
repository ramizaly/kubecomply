{{- $fw := .Values.compliance.frameworks.iso27001 -}}
{{- $name := "iso-a8.21-no-host-network" -}}
{{- if eq (include "compliance.policyEnabled" (dict "framework" $fw "name" $name)) "true" }}
{{- $mode := include "compliance.policyMode" (dict "framework" $fw "name" $name) }}
{{- $namespaces := splitList "," (include "compliance.namespaces" (dict "framework" $fw "name" $name)) }}
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: {{ $name }}
  annotations:
    policies.kyverno.io/title: "Disallow Host Network and Host IPC"
    policies.kyverno.io/category: "ISO 27001"
    policies.kyverno.io/subject: "Pod"
    policies.kyverno.io/severity: high
    policies.kyverno.io/description: >-
      hostNetwork lets a container bind the node's network interfaces
      directly and observe/intercept traffic meant for other pods, bypassing
      whatever network segmentation iso-a8.20-require-networkpolicy is
      enforcing. hostIPC lets a container share the host's inter-process
      communication namespace, exposing shared memory and semaphores used by
      host processes. Neither should be requested by ordinary workloads.
    compliance.framework/name: "ISO/IEC 27001:2022"
    compliance.framework/control-id: "A.8.21"
    compliance.framework/control-text: >-
      Security of network services: security mechanisms, service levels and
      service requirements of network services shall be identified,
      implemented and monitored.
    compliance.mode: "{{ $mode }}"
spec:
  background: true
  rules:
    - name: disallow-host-network-and-ipc
      match:
        any:
          - resources:
              kinds:
                - Pod
              {{- if not (has "*" $namespaces) }}
              namespaces:
                {{- range $namespaces }}
                - {{ . }}
                {{- end }}
              {{- end }}
      validate:
        failureAction: {{ $mode | lower | title }}
        message: >-
          Pods must not set hostNetwork or hostIPC (ISO 27001 A.8.21). Both
          must be unset or false.
        pattern:
          spec:
            =(hostNetwork): "false"
            =(hostIPC): "false"
{{- end }}
