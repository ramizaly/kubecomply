{{- $fw := .Values.compliance.frameworks.iso27001 -}}
{{- $name := "iso-a8.31-require-env-label" -}}
{{- if eq (include "compliance.policyEnabled" (dict "framework" $fw "name" $name)) "true" }}
{{- $mode := include "compliance.policyMode" (dict "framework" $fw "name" $name) }}
{{- if not $fw.environmentLabelValues }}
{{- fail "compliance.frameworks.iso27001.environmentLabelValues must list at least one value when this policy is enabled" }}
{{- end }}
{{- $envValues := join " | " $fw.environmentLabelValues }}
{{- $namespaces := splitList "," (include "compliance.namespaces" (dict "framework" $fw "name" $name)) }}
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: {{ $name }}
  annotations:
    policies.kyverno.io/title: "Require an Environment Label"
    policies.kyverno.io/category: "ISO 27001"
    policies.kyverno.io/subject: "Pod"
    policies.kyverno.io/severity: low
    policies.kyverno.io/description: >-
      Every workload must declare which environment it belongs to, so that
      development, test and production workloads can be told apart and kept
      separate by scheduling, network and access rules. The accepted values
      are set via compliance.frameworks.iso27001.environmentLabelValues in
      values.yaml.
    compliance.framework/name: "ISO/IEC 27001:2022"
    compliance.framework/control-id: "A.8.31"
    compliance.framework/control-text: >-
      Separation of development, test and production environments:
      development, testing and production environments shall be separated
      and secured.
    compliance.mode: "{{ $mode }}"
spec:
  background: true
  rules:
    - name: require-environment-label
      match:
        any:
          - resources:
              kinds:
                - Pod
              {{- if not (has "*" $namespaces) }}
              namespaces:
                {{- range $namespaces }}
                - {{ . }}
                {{- end }}
              {{- end }}
      validate:
        failureAction: {{ $mode | lower | title }}
        message: >-
          The label 'environment' is required and must be one of
          {{ $envValues }} (ISO 27001 A.8.31).
        pattern:
          metadata:
            labels:
              environment: "{{ $envValues }}"
{{- end }}
