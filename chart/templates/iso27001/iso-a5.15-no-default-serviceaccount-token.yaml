{{- $fw := .Values.compliance.frameworks.iso27001 -}}
{{- $name := "iso-a5.15-no-default-serviceaccount-token" -}}
{{- if eq (include "compliance.policyEnabled" (dict "framework" $fw "name" $name)) "true" }}
{{- $mode := include "compliance.policyMode" (dict "framework" $fw "name" $name) }}
{{- $namespaces := splitList "," (include "compliance.namespaces" (dict "framework" $fw "name" $name)) }}
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: {{ $name }}
  annotations:
    policies.kyverno.io/title: "Disallow the Default ServiceAccount and Unneeded Token Automount"
    policies.kyverno.io/category: "ISO 27001"
    policies.kyverno.io/subject: "Pod"
    policies.kyverno.io/severity: medium
    policies.kyverno.io/description: >-
      The implicit 'default' ServiceAccount is shared by every Pod in a
      namespace that doesn't request one explicitly, so granting it any RBAC
      permissions affects workloads that never opted in. Pods should name a
      dedicated ServiceAccount and only automount its API token when the
      workload actually calls the Kubernetes API. This is a separate check
      from iso-a5.15-no-wildcard-rbac.yaml, which validates the RBAC rules
      themselves rather than which identity a Pod runs as.
    compliance.framework/name: "ISO/IEC 27001:2022"
    compliance.framework/control-id: "A.5.15"
    compliance.framework/control-text: >-
      Access control: rules to control physical and logical access to
      information and other associated assets shall be established and
      implemented based on business and information security requirements.
    compliance.mode: "{{ $mode }}"
spec:
  background: true
  rules:
    - name: disallow-default-serviceaccount
      match:
        any:
          - resources:
              kinds:
                - Pod
              {{- if not (has "*" $namespaces) }}
              namespaces:
                {{- range $namespaces }}
                - {{ . }}
                {{- end }}
              {{- end }}
      validate:
        failureAction: {{ $mode | lower | title }}
        message: >-
          Pod '{{ "{{" }} request.object.metadata.name {{ "}}" }}' uses the implicit
          'default' ServiceAccount (ISO 27001 A.5.15). Set
          spec.serviceAccountName to a dedicated, least-privilege
          ServiceAccount.
        deny:
          conditions:
            any:
              - key: >-
                  {{ "{{" }} request.object.spec.serviceAccountName ||
                  request.object.spec.serviceAccount || 'default' {{ "}}" }}
                operator: Equals
                value: "default"

    - name: require-automount-token-disabled
      match:
        any:
          - resources:
              kinds:
                - Pod
              {{- if not (has "*" $namespaces) }}
              namespaces:
                {{- range $namespaces }}
                - {{ . }}
                {{- end }}
              {{- end }}
      validate:
        failureAction: {{ $mode | lower | title }}
        message: >-
          Pod '{{ "{{" }} request.object.metadata.name {{ "}}" }}' does not explicitly set
          spec.automountServiceAccountToken=false (ISO 27001 A.5.15). Disable
          automount unless this workload calls the Kubernetes API.
        pattern:
          spec:
            automountServiceAccountToken: false
{{- end }}
