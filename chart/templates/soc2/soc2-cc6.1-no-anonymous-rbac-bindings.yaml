{{- $fw := .Values.compliance.frameworks.soc2 -}}
{{- $name := "soc2-cc6.1-no-anonymous-rbac-bindings" -}}
{{- if eq (include "compliance.policyEnabled" (dict "framework" $fw "name" $name)) "true" }}
{{- $mode := include "compliance.policyMode" (dict "framework" $fw "name" $name) }}
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: {{ $name }}
  annotations:
    policies.kyverno.io/title: "Disallow RBAC Bindings to Anonymous or All-Users Groups"
    policies.kyverno.io/category: "SOC 2"
    policies.kyverno.io/subject: "RoleBinding, ClusterRoleBinding"
    policies.kyverno.io/severity: high
    policies.kyverno.io/description: >-
      Binding a Role to system:anonymous or system:unauthenticated grants
      that permission to anyone who can reach the API server, with no
      identification at all; binding to system:authenticated grants it to
      every identity the cluster trusts, which defeats per-user
      authorization. CC6.1 requires users to be identified and authenticated
      before accessing information assets. Kubernetes' own built-in bindings
      (named system:*) and kubeadm's cluster-info binding (kubeadm:*) are
      excluded. Note: the name-based exclusion is a convenience, not a
      security boundary — pair it with CC6.3's RBAC policies so that only
      admins can create bindings at all.
    compliance.framework/name: "SOC 2 (AICPA Trust Services Criteria 2017, rev. 2022)"
    compliance.framework/control-id: "CC6.1"
    compliance.framework/control-text: >-
      The entity implements logical access security software, infrastructure,
      and architectures over protected information assets to protect them
      from security events to meet the entity's objectives. (Point of focus:
      Identifies and Authenticates Users — persons, infrastructure, and
      software are identified and authenticated prior to accessing
      information assets, whether locally or remotely.)
    compliance.mode: "{{ $mode }}"
spec:
  background: true
  rules:
    - name: no-anonymous-or-all-users-subjects
      # compliance.frameworks.soc2.namespaces is intentionally not applied
      # here: this rule mixes a namespaced kind (RoleBinding) with a
      # cluster-scoped one (ClusterRoleBinding).
      match:
        any:
          - resources:
              kinds:
                - RoleBinding
                - ClusterRoleBinding
      exclude:
        any:
          - resources:
              kinds:
                - RoleBinding
                - ClusterRoleBinding
              names:
                - "system:*"
                - "kubeadm:*"
      validate:
        failureAction: {{ $mode | lower | title }}
        message: >-
          {{ "{{" }} request.object.kind {{ "}}" }} '{{ "{{" }} request.object.metadata.name {{ "}}" }}'
          binds system:anonymous, system:unauthenticated or
          system:authenticated (SOC 2 CC6.1). Bind named users, groups or
          ServiceAccounts instead.
        deny:
          conditions:
            any:
              - key: "{{ "{{" }} request.object.subjects[].name || `[]` {{ "}}" }}"
                operator: AnyIn
                value:
                  - system:anonymous
                  - system:unauthenticated
                  - system:authenticated
{{- end }}
