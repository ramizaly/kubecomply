{{- $fw := .Values.compliance.frameworks.soc2 -}}
{{- $name := "soc2-cc6.1-no-secrets-in-env" -}}
{{- if eq (include "compliance.policyEnabled" (dict "framework" $fw "name" $name)) "true" }}
{{- $mode := include "compliance.policyMode" (dict "framework" $fw "name" $name) }}
{{- $namespaces := splitList "," (include "compliance.namespaces" (dict "framework" $fw "name" $name)) }}
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: {{ $name }}
  annotations:
    policies.kyverno.io/title: "Disallow Secrets as Environment Variables"
    policies.kyverno.io/category: "SOC 2"
    policies.kyverno.io/subject: "Pod"
    policies.kyverno.io/severity: medium
    policies.kyverno.io/description: >-
      Credentials and keys held in environment variables leak far more
      readily than mounted files — into crash dumps, `kubectl describe`
      output, logs, child-process environments and third-party APM/error
      reporting tools. CC6.1 requires credentials and encryption keys to be
      protected during use. Secrets must be projected as a volume, not
      referenced from env/envFrom.
    compliance.framework/name: "SOC 2 (AICPA Trust Services Criteria 2017, rev. 2022)"
    compliance.framework/control-id: "CC6.1"
    compliance.framework/control-text: >-
      The entity implements logical access security software, infrastructure,
      and architectures over protected information assets to protect them
      from security events to meet the entity's objectives. (Points of focus:
      Manages Credentials for Infrastructure and Software; Protects
      Encryption Keys — processes are in place to protect encryption keys
      during generation, storage, use, and destruction.)
    compliance.mode: "{{ $mode }}"
spec:
  background: true
  rules:
    - name: disallow-secrets-as-env-vars
      match:
        any:
          - resources:
              kinds:
                - Pod
              {{- if not (has "*" $namespaces) }}
              namespaces:
                {{- range $namespaces }}
                - {{ . }}
                {{- end }}
              {{- end }}
      validate:
        failureAction: {{ $mode | lower | title }}
        message: >-
          Containers must not reference Secrets via env or envFrom
          (SOC 2 CC6.1). Mount the Secret as a volume instead.
        foreach:
          - list: "request.object.spec.containers"
            deny:
              conditions:
                any:
                  - key: "{{ "{{" }} length(element.env[?valueFrom.secretKeyRef] || `[]`) {{ "}}" }}"
                    operator: GreaterThan
                    value: 0
                  - key: "{{ "{{" }} length(element.envFrom[?secretRef] || `[]`) {{ "}}" }}"
                    operator: GreaterThan
                    value: 0
          - list: "request.object.spec.initContainers || `[]`"
            deny:
              conditions:
                any:
                  - key: "{{ "{{" }} length(element.env[?valueFrom.secretKeyRef] || `[]`) {{ "}}" }}"
                    operator: GreaterThan
                    value: 0
                  - key: "{{ "{{" }} length(element.envFrom[?secretRef] || `[]`) {{ "}}" }}"
                    operator: GreaterThan
                    value: 0
{{- end }}
